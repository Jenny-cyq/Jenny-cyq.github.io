<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>访问验证｜OTC事业部经营分析看板</title>
    <style>
      :root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #17213a;
        background: radial-gradient(circle at 14% 10%, #dce9ff 0, transparent 34%),
          radial-gradient(circle at 90% 88%, #d9f7f0 0, transparent 32%), #f4f7fc; }
      main { width: min(440px, 100%); background: rgba(255,255,255,.96); border: 1px solid #dfe6f2;
        border-radius: 24px; padding: 34px; box-shadow: 0 24px 70px rgba(30,56,110,.16); }
      .mark { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 16px;
        color: #fff; font-weight: 800; letter-spacing: .08em; background: linear-gradient(135deg,#3155d5,#14a38b); }
      h1 { margin: 24px 0 8px; font-size: 28px; letter-spacing: -.02em; }
      p { margin: 0; color: #66728a; line-height: 1.7; }
      form { display: grid; gap: 14px; margin-top: 28px; }
      label { font-size: 14px; font-weight: 700; }
      input { width: 100%; border: 1px solid #cfd8e8; border-radius: 12px; padding: 14px 15px; font-size: 16px;
        outline: none; transition: .2s border-color,.2s box-shadow; }
      input:focus { border-color: #3155d5; box-shadow: 0 0 0 4px rgba(49,85,213,.12); }
      button { border: 0; border-radius: 12px; padding: 14px; color: #fff; background: #3155d5;
        font-size: 16px; font-weight: 750; cursor: pointer; }
      .error { min-height: 22px; color: #a12736; font-size: 14px; }
      small { display: block; margin-top: 18px; color: #8a95a9; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">OTC</div>
      <h1>经营分析看板访问验证</h1>
      <p>请输入访问密码，验证成功后进入看板。</p>
      <form id="login-form">
        <label for="password">访问密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <button type="submit">进入看板</button>
        <div class="error" id="error" role="alert" aria-live="polite"></div>
      </form>
      <small>该页面包含经营成本与组织数据，请勿将密码转发给无关人员。</small>
    </main>
    <script>
      const expectedHash = "e92c40b1e73a72c75aa4317444be9bfbed78ba864399cc3b3b197999bde73d02";
      const toHex = (bytes) => Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
      document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.getElementById("password").value;
        const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password));
        if (toHex(new Uint8Array(digest)) === expectedHash) {
          sessionStorage.setItem("otc_dashboard_access", "granted");
          location.replace("/dashboard.html");
          return;
        }
        document.getElementById("error").textContent = "密码不正确，请重新输入。";
        document.getElementById("password").select();
      });
    </script>
  </body>
</html>
